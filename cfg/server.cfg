// Jedi Academy dedicated server, JA+ mod. Free-for-all with sabers, guns and
// force, bots filling the empty slots, a rotation of the stock FFA maps.
//
// THE TWO PLACEHOLDERS ARE FILLED AT START from .env, by the command in the
// compose file. idTech3 reads rconpassword from this file and nowhere else,
// and this file is tracked in git: a real value here would be a secret in a
// repository. Leave them exactly as they are.

seta sv_hostname "Jedi Academy FFA"
seta g_motd "Sabers, guns and force. Bots fill the room."

seta rconpassword "__JKA_SERVER_RCON_PASSWORD__"
seta net_port __JKA_SERVER_PORT__

// 0 = FFA. 3 = duel, 4 = power duel, 6 = TFFA, 7 = siege, 8 = CTF.
seta g_gametype 0
seta sv_maxclients 14
seta sv_privateClients 0
seta g_password ""

// Bots keep the server populated until humans arrive, then step aside.
seta bot_minplayers 4
seta g_maxGameClients 0

// Weapons, force and sabers all on.
seta g_weaponDisable 0
seta g_forcePowerDisable 0
seta g_saberLocking 1
seta g_privateDuel 1

// Fewer complaints, fewer kicks.
seta g_friendlySaber 0
seta g_friendlyFire 0
seta g_allowVote 1
seta g_inactivity 0
seta g_timeouttospec 0

// Stock FFA rotation. Each vstr names the next map so the cycle closes.
seta ffa1 "map mp/ffa1 ; set nextmap vstr ffa2"
seta ffa2 "map mp/ffa2 ; set nextmap vstr ffa3"
seta ffa3 "map mp/ffa3 ; set nextmap vstr ffa4"
seta ffa4 "map mp/ffa4 ; set nextmap vstr ffa5"
seta ffa5 "map mp/ffa5 ; set nextmap vstr ffa1"
seta timelimit 20
seta fraglimit 30

vstr ffa5
