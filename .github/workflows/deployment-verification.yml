name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: jka-server
            env_var: JKA_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" jediacademy-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, in both directions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tests/e2e-healthcheck.sh

      - name: Prove the exact match catches what a substring match misses
        # Assertions against a real container, with no game download: two
        # processes named cs2 and cs2.sh are the whole fixture. The game is
        # killed and the exact check must go red while the substring check
        # stays green - if the substring form ever failed too, the comment in
        # the compose file would be wrong and the run says so.
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f jediacademy-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  refuses-without-assets:
    name: The server refuses to start without the game files, and says so
    # The image cannot ship Jedi Academy's assets0-3.pk3 - they belong to the
    # game's owner. Started with an empty assets directory it must stop, not
    # sit there looking like a server. This proves the refusal is loud.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The rcon password is rendered from .env, and the tracked file never carries it
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          grep -q '__JKA_SERVER_RCON_PASSWORD__' cfg/server.cfg
          if grep -q 'ci-placeholder' cfg/server.cfg; then echo '::error::the tracked config carries a rendered value'; exit 1; fi
          docker compose -f jediacademy-server-docker-compose.yml -p jka run --rm --no-deps --entrypoint /bin/bash jka-server -c \
            'sed -e "s|__JKA_SERVER_RCON_PASSWORD__|$JKA_SERVER_RCON_PASSWORD|" /ja/japluscfg/server.cfg.template | grep -q "rconpassword \"ci-placeholder\""' \
            && echo "rendered from the environment, as designed"

      - name: Start with an empty assets directory
        run: |
          mkdir -p assets
          docker compose -f jediacademy-server-docker-compose.yml -p jka up -d --no-recreate 2>&1 | tail -3 || true
          # The container is expected to EXIT. restart: unless-stopped brings it
          # back, so what is asserted is that it never stays up, not that it is
          # gone at one instant.
          cid="$(docker compose -f jediacademy-server-docker-compose.yml -p jka ps -aq jka-server)"
          up=0
          for _ in $(seq 1 12); do
            sleep 5
            if [ "$(docker inspect "$cid" --format '{{.State.Running}}' 2>/dev/null)" = true ] && \
               [ "$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null)" = healthy ]; then
              up=1; break
            fi
          done
          docker logs "$cid" 2>&1 | tail -20
          # The refusal must be the image's own, which means the rcon render
          # step before it ran: the start script's message is the proof.
          docker logs "$cid" 2>&1 | grep -q "All 4 .pk3 files must be present" \
            || { echo "::error::expected the start script's own refusal message"; exit 1; }
          if [ "$up" = 1 ]; then
            echo "::error::the server came up healthy with no game files, which cannot be a working server"
            exit 1
          fi
          echo "refused without assets, as it must"

      - name: Stop
        if: always()
        run: docker compose -f jediacademy-server-docker-compose.yml -p jka down -v --remove-orphans
